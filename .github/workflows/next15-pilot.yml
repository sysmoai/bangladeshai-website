name: Isolated Next.js 15 security migration pilot

on:
  push:
    branches:
      - security/bangladeshai-next15-pilot-20261103

permissions:
  contents: write

jobs:
  pilot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated pilot
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup pnpm
        run: corepack enable && corepack prepare pnpm@10.33.2 --activate
      - name: Install baseline dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Assert target Next.js version
        run: node -e "if(require('./node_modules/next/package.json').version !== '15.5.28') process.exit(1)"
      - name: Validate Node regression tests
        run: node --test tests/*.test.mjs
      - name: Build complete static site with Next.js 15
        run: pnpm build
      - name: Verify static export and links
        run: |
          node scripts/verify-static-output.mjs out
          node scripts/audit-static-links.mjs out
      - name: Production dependency security audit (reported, not auto-waived)
        run: pnpm audit --prod --audit-level high
      - name: Validate generated lockfile and commit to isolated security branch
        env:
          TARGET_BRANCH: security/bangladeshai-next15-pilot-20261103
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git commit -m "security: commit audited Next.js 15 lockfile"
            git push origin HEAD:refs/heads/$TARGET_BRANCH
          fi
          echo "Dependency audit and Next.js migration pilot passed. No production deploy performed." >> "$GITHUB_STEP_SUMMARY"
