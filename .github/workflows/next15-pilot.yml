name: Isolated Next.js 15 security migration pilot

on:
  push:
    branches:
      - security/bangladeshai-next15-pilot-20261103

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated pilot
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup pnpm
        run: corepack enable && corepack prepare pnpm@10.33.2 --activate
      - name: Install baseline dependencies
        run: pnpm install --frozen-lockfile
      - name: Upgrade Next.js to supported security release in runner only
        run: pnpm add -E next@15.5.28
      - name: Validate Node regression tests
        run: node --test tests/*.test.mjs
      - name: Build complete static site with Next.js 15
        run: pnpm build
      - name: Verify static export and links
        run: |
          node scripts/verify-static-output.mjs out
          node scripts/audit-static-links.mjs out
      - name: Production dependency security audit (reported, not auto-waived)
        run: pnpm audit --prod --audit-level high
        continue-on-error: true
      - name: Show candidate migration diff
        run: |
          git diff --check
          git diff --stat
          echo "PILOT ONLY — no source branch or production files were modified by the workflow."
