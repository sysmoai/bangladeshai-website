name: Validate BangladeshAI.org release artifact

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Node regression tests
        run: node --test tests/*.test.mjs
      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@10.33.2 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Inspect deployable output (fails until static export is implemented)
        run: node scripts/verify-static-output.mjs out
      - name: Attach validated static website for staging
        uses: actions/upload-artifact@v4
        with:
          name: bangladeshai-static-site
          path: out/
          if-no-files-found: error
          retention-days: 7

# SECURITY: Do not silently deploy "." (repository source) or ".next/static".
# Cloudflare deployment intentionally disabled until verified deployable
# artifact, authenticated target, evidence QA, and runtime are approved.
