name: Validate BangladeshAI.org release artifact

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Node regression tests
        run: node --test tests/*.test.mjs
      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@10.33.2 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Inspect deployable output (fails until static export is implemented)
        run: node scripts/verify-static-output.mjs out
      - name: Audit exported routes and internal links
        run: node scripts/audit-static-links.mjs out
      - name: Attach validated static website for staging
        uses: actions/upload-artifact@v4
        with:
          name: bangladeshai-static-site
          path: out/
          if-no-files-found: error
          retention-days: 7



  browser-smoke:
    name: Real browser smoke and responsive screenshot capture
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download validated static site
        uses: actions/download-artifact@v4
        with:
          name: bangladeshai-static-site
          path: out/
      - name: Headless browser smoke test
        run: bash scripts/browser-smoke.sh out
      - name: Attach desktop/mobile QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bangladeshai-browser-qa
          path: qa-screenshots/
          if-no-files-found: warn
          retention-days: 7

  cloudflare-preview:
    name: Deploy isolated Cloudflare Pages preview when credentials exist
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check existing GitHub Cloudflare secret (never print token)
        id: access
        shell: bash
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare API credential not connected to this repository. Preview deployment unavailable without authorized account access." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare API token is available. Attempting isolated preview deployment." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Checkout for artifact gate
        if: steps.access.outputs.available == 'true'
        uses: actions/checkout@v4

      - name: Node for Wrangler
        if: steps.access.outputs.available == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Retrieve approved static artifact
        if: steps.access.outputs.available == 'true'
        uses: actions/download-artifact@v4
        with:
          name: bangladeshai-static-site
          path: out/

      - name: Revalidate artifact
        if: steps.access.outputs.available == 'true'
        run: node scripts/verify-static-output.mjs out

      - name: Deploy review branch to separate Cloudflare Pages project
        if: steps.access.outputs.available == 'true'
        shell: bash
        env:
          REVIEW_BRANCH: preview-pr-${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Historical account ID is already documented in this repository.
          # If an account ID secret exists, it takes precedence.
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            export CLOUDFLARE_ACCOUNT_ID="4ca6269edabb6ad2906d70ec6845de22"
          fi
          project="bangladeshai-review-stage"
          url="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${project}"
          status="$(curl --silent --show-error --output /tmp/cf-project-status --write-out '%{http_code}' \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$url")"
          if [ "$status" = "404" ]; then
            echo "No existing staging project; creating isolated Pages review project." >> "$GITHUB_STEP_SUMMARY"
            npx --yes wrangler@4 pages project create "$project" --production-branch=main
          elif [ "$status" = "200" ]; then
            echo "Existing isolated review project found." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Cloudflare authentication or project lookup failed with HTTP $status; no deployment attempted"
            exit 1
          fi
          npx --yes wrangler@4 pages deploy out --project-name="$project" --branch="$REVIEW_BRANCH" --commit-hash="$GITHUB_SHA"
          echo "Cloudflare Pages preview deployed to branch $REVIEW_BRANCH; root production domain/DNS untouched." >> "$GITHUB_STEP_SUMMARY"

# SECURITY: Never deploy the repository root or change production DNS in this workflow.
